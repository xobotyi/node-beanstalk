name: "CI/CD"

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master
  workflow_dispatch:

jobs:
  check:
    name: "Check"
    runs-on: ubuntu-latest
    steps:
      - name: "Checkout"
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: "Setup Vite+"
        uses: voidzero-dev/setup-vp@49c3e4e92c52e7f8392712a9267bbe71c5ab30e5 # v1.19.0
        with:
          node-version: "lts"
          cache: true
      - name: "Install dependencies"
        run: vp install --frozen-lockfile
      - name: "Check"
        run: vp check
      - name: "Typecheck"
        run: yarn typecheck

  build:
    name: "Build"
    runs-on: ubuntu-latest
    steps:
      - name: "Checkout"
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: "Setup Vite+"
        uses: voidzero-dev/setup-vp@49c3e4e92c52e7f8392712a9267bbe71c5ab30e5 # v1.19.0
        with:
          node-version: "lts"
          cache: true
      - name: "Install dependencies"
        run: vp install --frozen-lockfile
      - name: "Build"
        run: yarn build

  test:
    name: "Test"
    runs-on: ubuntu-latest
    steps:
      - name: "Checkout"
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: "Setup Vite+"
        uses: voidzero-dev/setup-vp@49c3e4e92c52e7f8392712a9267bbe71c5ab30e5 # v1.19.0
        with:
          node-version: "lts"
          cache: true
      - name: "Install dependencies"
        run: vp install --frozen-lockfile
      - name: "Test"
        run: vp test --coverage --reporter=default --reporter=github-actions
      - name: "Upload coverage to Codecov"
        uses: codecov/codecov-action@v4
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: coverage/lcov.info
          fail_ci_if_error: true

  dependabot-merge:
    name: "Dependabot automerge"
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
      contents: write
    needs: [ "check", "test", "build" ]
    if: github.actor == 'dependabot[bot]' && github.event_name == 'pull_request'
    steps:
      - uses: fastify/github-action-merge-dependabot@v3
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          target: 'minor'

  semantic-release:
    name: "Release"
    runs-on: ubuntu-latest
    needs: [ "check", "test", "build" ]
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    outputs:
      new-release-published: ${{ steps.release.outputs.new-release-published }}
    steps:
      - name: "Checkout"
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: "Setup Vite+"
        uses: voidzero-dev/setup-vp@49c3e4e92c52e7f8392712a9267bbe71c5ab30e5 # v1.19.0
        with:
          node-version: "lts"
          cache: true
      - name: "Install dependencies"
        run: vp install --frozen-lockfile
      - name: "Release"
        id: "release"
        uses: codfish/semantic-release-action@v3.4.1
        env:
          GITHUB_TOKEN: ${{ secrets.GH_TOKEN }}
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}

  deploy-gh-pages:
    name: "Deploy GH Pages"
    runs-on: ubuntu-latest
    needs: "semantic-release"
    if: needs.semantic-release.outputs.new-release-published == 'true' || github.event_name == 'workflow_dispatch'
    steps:
      - name: "Checkout"
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: "Setup Vite+"
        uses: voidzero-dev/setup-vp@49c3e4e92c52e7f8392712a9267bbe71c5ab30e5 # v1.19.0
        with:
          node-version: "lts"
          cache: true
      - name: "Install dependencies"
        run: vp install --frozen-lockfile
      - name: "Build docs"
        run: yarn docs:build
      - name: "Deploy"
        run: |
          git config --local user.name xobotyi && git config --local user.email xog3@yandex.ru
          git checkout --orphan gh-pages
          git --work-tree docs add --all
          git --work-tree docs commit -m 'gh-pages'
          git push origin HEAD:gh-pages --force
